<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- ===============================
         문서 기본 설정
         =============================== -->
    <meta charset="UTF-8">

    <!-- approval 객체 존재 여부에 따라 제목 분기
         - null  : 결재 요청 등록
         - not null : 결재 요청 수정 -->
    <title th:text="${approval != null} ? '결재 요청 수정' : '결재 요청 등록'"></title>

    <!-- ===============================
         공통 관리자 레이아웃 CSS
         =============================== -->
    <link rel="stylesheet" href="/css/admin/admin_layout.css" />

    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>

    <!-- SweetAlert2 (등록/수정 확인 모달) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- ===============================
         페이지 전용 스타일
         =============================== -->
    <style>
        :root {
          --primary: #337D89;
          --bg: #eef3f5;
          --card: #fff;
          --border: #ddd;
        }

        /* 기본 리셋 */
        *, *::before, *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          background: var(--bg);
          font-family: "Segoe UI", sans-serif;
        }

        /* ===============================
           결재 요청 폼 컨테이너
           =============================== */
        .form-container {
          max-width: 700px;
          margin: 40px auto;
          background: var(--card);
          padding: 30px;
          border-radius: 12px;
          box-shadow: 0 4px 12px rgba(0,0,0,.1);
          max-height: 75vh;
          overflow-y: auto;
        }

        /* 페이지 제목 */
        .form-container h1 {
          font-size: 28px;
          color: var(--primary);
          margin-bottom: 24px;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        /* 입력 라벨 */
        label {
          display: block;
          font-weight: 700;
          margin: 18px 0 8px;
        }

        /* 입력 필드 공통 */
        input[type="text"],
        textarea {
          width: 100%;
          padding: 12px;
          border: 1px solid var(--border);
          border-radius: 8px;
          font-size: 15px;
          transition: border-color .3s;
        }

        /* 포커스 시 강조 */
        input:focus,
        textarea:focus {
          border-color: var(--primary);
          outline: none;
        }

        textarea {
          height: 180px;
          resize: none;
        }

        /* ===============================
           제출 버튼
           =============================== */
        .btn-submit {
          background: var(--primary);
          color: #fff;
          border: none;
          padding: 12px 24px;
          border-radius: 8px;
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          transition: filter .2s;
          margin: 0;
        }

        .btn-submit:hover {
          filter: brightness(.9);
        }

        /* 버튼 우측 정렬 */
        .form-actions {
          display: flex;
          justify-content: flex-end;
          margin-top: 30px;
        }

        /* 헤더 로고 위치 보정 */
        .admin-header .logo {
          position: relative;
        }
    </style>
</head>

<body>
<div class="layout">

    <!-- ===============================
         관리자 헤더
         =============================== -->
    <div th:replace="admin/admin_header :: adminHeader"></div>

    <div class="main-wrapper">

        <!-- 관리자 사이드바 -->
        <div th:replace="admin/admin_aside :: adminAside"></div>

        <main class="content">
            <div class="form-container">

                <!-- ===============================
                     페이지 제목
                     =============================== -->
                <h1>
                    <i class="fas fa-edit"></i>
                    <span th:text="${approval != null} ? '결재 요청 수정' : '결재 요청 등록'"></span>
                </h1>

                <!-- ===============================
                     선택된 펀드 정보 표시
                     =============================== -->
                <p>
                    펀드:
                    <strong th:text="${approval?.fund?.fundName} ?: ${fundName}"></strong>
                </p>

                <!-- ===============================
                     결재 요청 등록 / 수정 폼
                     =============================== -->
                <form th:action="${approval != null}
                            ? @{'/admin/approval/update/' + ${approval.approvalId}}
                            : @{/admin/approval/register}"
                      method="post">

                    <!-- 제목 입력 -->
                    <label for="title">제목</label>
                    <input id="title"
                           type="text"
                           name="title"
                           th:value="${approval?.title}"
                           placeholder="제목을 입력하세요"
                           required />

                    <!-- 내용 입력 -->
                    <label for="content">내용</label>
                    <textarea id="content"
                              name="content"
                              placeholder="내용을 입력하세요"
                              required
                              th:text="${approval?.content}"></textarea>

                    <!-- 펀드 ID (hidden 값)
                         - 수정: approval.fund.fundId
                         - 등록: fundId -->
                    <input type="hidden"
                           name="fundId"
                           th:value="${approval?.fund?.fundId} ?: ${fundId}" />

                    <!-- 제출 버튼 -->
                    <div class="form-actions">
                        <button type="submit"
                                class="btn-submit"
                                th:text="${approval != null} ? '재기안' : '등록'">
                        </button>
                    </div>
                </form>

                <!-- 목록 이동 -->
                <a th:href="@{/admin/approval/list}"
                   style="display:inline-block; margin-top:20px;
                    color:var(--primary); font-weight:600; text-decoration:none;">
                    ← 목록으로
                </a>
            </div>
        </main>
    </div>
</div>

<!-- ===============================
     JavaScript
     =============================== -->
<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {

      // 폼과 제출 버튼 참조
      const form = document.querySelector('form');
      const submit = form.querySelector('.btn-submit');

      // 등록 / 재기안 확인 모달
      submit.addEventListener('click', e => {
        e.preventDefault();

        Swal.fire({
          // approval 존재 여부에 따라 메시지 분기
          title: /*[[${approval != null} ? '재기안 하시겠습니까?' : '등록하시겠습니까?']]*/,
          icon: 'question',
          showCancelButton: true,
          confirmButtonText: '예',
          cancelButtonText: '아니오'
        }).then(result => {
          if (result.isConfirmed) {
            form.submit();
          }
        });
      });
    });
    /*]]>*/
</script>
</body>
</html>
