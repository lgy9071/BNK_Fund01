<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- ============================= -->
    <!-- 문서 인코딩 설정 -->
    <!-- ============================= -->
    <meta charset="UTF-8">

    <!-- ============================= -->
    <!-- 페이지 제목 -->
    <!-- 브라우저 탭에 표시됨 -->
    <!-- ============================= -->
    <title>Main</title>

    <!-- ============================= -->
    <!-- Bootstrap 5 CSS (CDN) -->
    <!-- UI 컴포넌트 및 레이아웃 사용 -->
    <!-- ============================= -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ============================= -->
    <!-- 커스텀 CSS -->
    <!-- 프로젝트 전용 스타일 -->
    <!-- ============================= -->
    <link href="/css/bank.css" rel="stylesheet">
</head>
<body>

<!-- ============================= -->
<!-- 공통 헤더 영역 -->
<!-- fragments/header.html 의 header fragment 를 불러옴 -->
<!-- 모든 페이지에서 재사용 -->
<!-- ============================= -->
<th:block th:replace="fragments/header :: header"></th:block>

<!-- ============================= -->
<!-- 메인 대시보드 안내 영역 -->
<!-- ============================= -->
<section class="container py-5">

    <!-- 중앙 정렬 -->
    <div class="text-center">

        <!-- ============================= -->
        <!-- 시스템 타이틀 -->
        <!-- ============================= -->
        <h2 class="fw-bold mb-4">BNK Fund Management System</h2>

        <!-- ============================= -->
        <!-- 로그인 상태일 경우 -->
        <!-- session.user 객체가 존재하면 표시 -->
        <!-- ============================= -->
        <div th:if="${session.user != null}" class="alert alert-success rounded-pill px-4">
            <!-- 로그인한 사용자 이름 출력 -->
            <span th:text="|${session.user.name} 님, 로그인 되었습니다.|"></span>
        </div>

        <!-- ============================= -->
        <!-- 비로그인 상태일 경우 -->
        <!-- session.user 가 null 이면 표시 -->
        <!-- ============================= -->
        <div th:if="${session.user == null}" class="alert alert-warning rounded-pill px-4">
            로그인 후 서비스를 이용할 수 있습니다.
        </div>

    </div>
</section>

</body>
</html>
