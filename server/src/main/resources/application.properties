# ===============================
# MariaDB setting (FIXED)
# ===============================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/mydb?useSsl=false&authenticationPlugins=mysql_native_password
spring.datasource.username=green
spring.datasource.password=1234

spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000

# ===============================
# JPA setting
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# File upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Session
# ===============================
server.servlet.session.timeout=10m

# ===============================
# OpenAI / AI
# ===============================
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=gemma2-9b-it
spring.ai.openai.chat.options.temperature=1

# ===============================
# Profiles
# ===============================
spring.profiles.include=secret

# ===============================
# JWT
# ===============================
jwt.secret=change-this-to-a-very-long-random-secret-string-change-this

jwt.access-secret=replace-with-very-long-random-secret-at-least-32-bytes-xxxxxxxx
jwt.access-expiration-millis=600000

refresh.ttl-seconds=2592000

# ===============================
# Logging
# ===============================
spring.thymeleaf.cache=false
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# Encoding
# ===============================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8

# ===============================
# Holiday API
# ===============================
holiday.api.base-url=http://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService
holiday.api.service-key=YOUR_SERVICE_KEY
holiday.api.timeout-ms=7000

# ===============================
# Encryption
# ===============================
app.encryption.secret-key=MyVerySecureKey12345678901234567

