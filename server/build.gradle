plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "1.0.0")
}

dependencies {

	// =================================================
	// Oracle / Wallet 관련 (사용 중단, 기록용)
	// =================================================
	// implementation 'com.oracle.database.security:oraclepki:21.19.0.0'
	// implementation 'com.oracle.database.security:osdt_core:21.19.0.0'
	// implementation 'com.oracle.database.security:osdt_cert:21.19.0.0'
	//
	// implementation files('libs/ojdbc11.jar')
	// implementation files('libs/oraclepki.jar')
	// implementation files('libs/osdt_core.jar')
	// implementation files('libs/osdt_cert.jar')

	// =================================================
	// DB / JPA
	// =================================================
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	// =================================================
	// Web / MVC
	// =================================================
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// =================================================
	// Security
	// =================================================
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.mindrot:jbcrypt:0.4'

	// =================================================
	// API Docs
	// =================================================
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

	// =================================================
	// AI
	// =================================================
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	// =================================================
	// Util
	// =================================================
	implementation 'org.apache.pdfbox:pdfbox:2.0.30'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// =================================================
	// JWT
	// =================================================
	implementation "io.jsonwebtoken:jjwt-api:0.12.3"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:0.12.3"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:0.12.3"

	// =================================================
	// Lombok
	// =================================================
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// =================================================
	// Dev / Test
	// =================================================
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

springBoot {
	mainClass = 'com.example.fund.BnkProject02Application'
}